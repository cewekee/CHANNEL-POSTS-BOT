name: Channel posts

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Опубликовать сразу: morning / joke / meme / fact (пусто — по расписанию)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: channel-posts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y -qq fonts-dejavu-core >/dev/null || true
      - run: pip install -r requirements.txt
      - name: Post
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE: ${{ github.event.inputs.force }}
        run: python bot.py
      - name: Save state
        if: always()
        run: |
          git config user.name "channel-posts-bot"
          git config user.email "channel-posts-bot@users.noreply.github.com"
          git add state.json emoji.json
          git diff --staged --quiet && exit 0
          git commit -m "state update [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
